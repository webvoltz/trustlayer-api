name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run build
      - run: npm run security:audit
